services:
  - type: web
    name: transportpro-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /api/health
    disk:
      name: transportpro-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EXCEL_FILE
        value: /var/data/Transport_Management.xlsx
      - key: FRONTEND_ORIGIN
        value: https://divakar07-pixel.github.io
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: None
